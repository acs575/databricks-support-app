<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Support Tickets</title>
  <style>
    :root {
      --bg:           #f0f2f5;
      --white:        #ffffff;
      --border:       #e2e8f0;
      --primary:      #3b82f6;
      --primary-dark: #2563eb;
      --danger:       #ef4444;
      --success:      #16a34a;
      --text:         #1e293b;
      --muted:        #64748b;
      --radius:       8px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column; overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 12px 24px; display: flex; align-items: center;
      justify-content: space-between; flex-shrink: 0;
    }
    header h1 { font-size: 18px; font-weight: 700; }

    /* ---- Stats bar ---- */
    .stats-bar {
      background: var(--white); border-bottom: 1px solid var(--border);
      padding: 10px 24px; display: flex; gap: 32px; flex-shrink: 0;
    }
    .stat { display: flex; flex-direction: column; gap: 1px; }
    .stat-value { font-size: 20px; font-weight: 700; }
    .stat-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
    .stat-value.open        { color: #3b82f6; }
    .stat-value.in_progress { color: #f59e0b; }
    .stat-value.resolved    { color: #22c55e; }

    /* ---- Two-panel layout ---- */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ---- Left panel ---- */
    .panel-left {
      width: 340px; min-width: 340px; border-right: 1px solid var(--border);
      background: var(--white); display: flex; flex-direction: column; overflow: hidden;
    }
    .panel-left-toolbar {
      padding: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .panel-left-toolbar select {
      width: 100%; padding: 7px 10px; border: 1px solid var(--border);
      border-radius: var(--radius); font-size: 13px; background: var(--bg); cursor: pointer;
    }
    .ticket-list { overflow-y: auto; flex: 1; }
    .ticket-item {
      padding: 13px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .1s; border-left: 3px solid transparent;
    }
    .ticket-item:hover  { background: #f8fafc; }
    .ticket-item.active { background: #eff6ff; border-left-color: var(--primary); }
    .ticket-item-title {
      font-size: 13px; font-weight: 600; margin-bottom: 6px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .ticket-item-meta { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .ticket-item-time { font-size: 11px; color: var(--muted); margin-left: auto; }

    /* ---- Right panel ---- */
    .panel-right { flex: 1; overflow-y: auto; padding: 24px; }
    .empty-state {
      height: 100%; display: flex; flex-direction: column;
      align-items: center; justify-content: center; color: var(--muted); gap: 10px;
    }
    .empty-state svg { opacity: .25; }
    .empty-state p { font-size: 14px; }
    .ticket-detail { max-width: 700px; }

    /* ---- Ticket detail header ---- */
    .detail-title { font-size: 22px; font-weight: 700; margin-bottom: 10px; }
    .detail-meta  { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 8px; }
    .detail-info  { font-size: 12px; color: var(--muted); margin-bottom: 20px; }

    /* ---- Badges ---- */
    .badge {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .4px;
    }
    .badge.s-open        { background: #dbeafe; color: #1d4ed8; }
    .badge.s-in_progress { background: #fef3c7; color: #92400e; }
    .badge.s-resolved    { background: #dcfce7; color: #166534; }
    .badge.p-high   { background: #fee2e2; color: #991b1b; }
    .badge.p-medium { background: #fef3c7; color: #92400e; }
    .badge.p-low    { background: #f1f5f9; color: #475569; }
    .badge.cat      { background: #f3e8ff; color: #6b21a8; }

    /* ---- Actions bar ---- */
    .actions-bar {
      background: #f8fafc; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 11px 14px; display: flex; gap: 12px; align-items: center;
      flex-wrap: wrap; margin-bottom: 22px;
    }
    .actions-bar label { font-size: 13px; font-weight: 600; }
    .actions-bar select {
      padding: 5px 9px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 13px;
    }
    .status-msg { font-size: 12px; color: var(--muted); }

    /* ---- Messages ---- */
    .section-title { font-size: 14px; font-weight: 700; margin-bottom: 12px; }
    .message-bubble {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px;
    }
    .msg-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
    .msg-author { font-size: 13px; font-weight: 600; }
    .msg-time   { font-size: 11px; color: var(--muted); }
    .msg-text   { font-size: 14px; line-height: 1.55; }

    /* ---- Forms ---- */
    .form-card {
      background: var(--white); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 16px; margin-top: 16px;
    }
    .form-group { margin-bottom: 11px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; margin-bottom: 4px; color: var(--muted); text-transform: uppercase; letter-spacing: .4px; }
    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%; padding: 8px 10px; border: 1px solid var(--border);
      border-radius: 6px; font-size: 14px; font-family: inherit;
    }
    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      outline: none; border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(59,130,246,.12);
    }
    .form-group textarea { resize: vertical; min-height: 80px; }
    .form-row { display: flex; gap: 12px; }
    .form-row .form-group { flex: 1; }
    .form-feedback { font-size: 12px; margin-top: 5px; min-height: 16px; }
    .form-feedback.error   { color: var(--danger); }
    .form-feedback.success { color: var(--success); }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: filter .15s, transform .1s;
    }
    .btn:active { transform: scale(.98); }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-danger  { background: var(--danger);  color: #fff; }
    .btn-danger:hover  { filter: brightness(1.1); }
    .btn-ghost {
      background: transparent; border: 1px solid var(--border); color: var(--text);
    }
    .btn-ghost:hover { background: var(--bg); }
    .btn-sm { padding: 4px 10px; font-size: 12px; }

    /* ---- Modal ---- */
    .overlay {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.4); z-index: 200;
      align-items: center; justify-content: center;
    }
    .overlay.open { display: flex; }
    .modal {
      background: var(--white); border-radius: 12px; padding: 24px;
      width: 460px; max-width: 96vw;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .modal-header {
      display: flex; justify-content: space-between;
      align-items: center; margin-bottom: 18px;
    }
    .modal-header h2 { font-size: 17px; font-weight: 700; }
    .modal-footer {
      display: flex; justify-content: flex-end;
      gap: 9px; margin-top: 18px;
    }
    .confirm-body { text-align: center; }
    .confirm-body p { color: var(--muted); font-size: 14px; margin: 10px 0 20px; }
    .confirm-buttons { display: flex; gap: 10px; justify-content: center; }

    .divider { height: 1px; background: var(--border); margin: 20px 0; }
  </style>
</head>
<body>

<!-- Header -->
<header>
  <h1>&#127917; Support Tickets</h1>
  <button class="btn btn-primary" onclick="openNewModal()">+ New Ticket</button>
</header>

<!-- Stats bar -->
<div class="stats-bar" id="stats-bar"></div>

<!-- Two-panel layout -->
<div class="main">

  <!-- Left: ticket list -->
  <div class="panel-left">
    <div class="panel-left-toolbar">
      <select id="status-filter" onchange="loadTickets()">
        <option value="">All statuses</option>
        <option value="open">Open</option>
        <option value="in_progress">In Progress</option>
        <option value="resolved">Resolved</option>
      </select>
    </div>
    <div class="ticket-list" id="ticket-list"></div>
  </div>

  <!-- Right: ticket detail -->
  <div class="panel-right" id="panel-right">
    <div class="empty-state">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
        <path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/>
        <rect x="9" y="3" width="6" height="4" rx="1"/>
        <path d="M9 12h6M9 16h4"/>
      </svg>
      <p>Select a ticket to view details</p>
    </div>
  </div>

</div>

<!-- New Ticket Modal -->
<div class="overlay" id="new-modal">
  <div class="modal">
    <div class="modal-header">
      <h2>New Ticket</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeNewModal()">&#10005;</button>
    </div>
    <div class="form-group">
      <label>Title <span style="color:var(--danger)">*</span></label>
      <input id="nt-title" type="text" placeholder="Describe the issue briefly..." maxlength="200">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Priority</label>
        <select id="nt-priority">
          <option value="low">Low</option>
          <option value="medium" selected>Medium</option>
          <option value="high">High</option>
        </select>
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="nt-category">
          <option value="bug">Bug</option>
          <option value="feature">Feature Request</option>
          <option value="question" selected>Question</option>
        </select>
      </div>
    </div>
    <div id="nt-feedback" class="form-feedback error"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeNewModal()">Cancel</button>
      <button class="btn btn-primary" onclick="submitNewTicket()">Create Ticket</button>
    </div>
  </div>
</div>

<!-- Confirm Delete Modal -->
<div class="overlay" id="confirm-modal">
  <div class="modal">
    <div class="confirm-body">
      <h2>Delete this ticket?</h2>
      <p>All messages will be permanently deleted. This cannot be undone.</p>
      <div class="confirm-buttons">
        <button class="btn btn-ghost" onclick="closeConfirm()">Cancel</button>
        <button class="btn btn-danger" onclick="confirmDelete()">Yes, Delete</button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

let _tickets        = [];
 let _selectedId    = null;
let _pendingDelete  = null;

/* ------------------------------------------------------------------ utils */

const esc = s => {
  const d = document.createElement('div');
  d.appendChild(document.createTextNode(s ?? ''));
  return d.innerHTML;
};

const statusLabel = { open:'Open', in_progress:'In Progress', resolved:'Resolved' };

const badge = (cls, text) =>
  `<span class="badge ${cls}">${esc(text)}</span>`;

const statusBadge   = s => badge(`s-${s}`, statusLabel[s] ?? s);
const priorityBadge = p => badge(`p-${p}`, p);
const catBadge      = c => badge('cat', c);

const timeAgo = iso => {
  const s = Math.floor((Date.now() - new Date(iso)) / 1000);
  if (s < 60)    return 'just now';
  if (s < 3600)  return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return new Date(iso).toLocaleDateString();
};

const fmt = iso => new Date(iso).toLocaleString();

/* --------------------------------------------------------------- stats bar */

async function loadStats() {
  try {
    const r = await fetch('/stats');
    const d = await r.json();
    if (!r.ok) return;
    const bs = d.by_status || {};
    document.getElementById('stats-bar').innerHTML = `
      <div class="stat"><div class="stat-value">${d.total_tickets}</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-value open">${bs.open??0}</div><div class="stat-label">Open</div></div>
      <div class="stat"><div class="stat-value in_progress">${bs.in_progress??0}</div><div class="stat-label">In Progress</div></div>
      <div class="stat"><div class="stat-value resolved">${bs.resolved??0}</div><div class="stat-label">Resolved</div></div>
      <div class="stat"><div class="stat-value">${d.avg_messages_per_ticket}</div><div class="stat-label">Avg Msgs</div></div>
    `;
  } catch(e) { console.error(e); }
}

/* ----------------------------------------------------------- ticket list */

async function loadTickets() {
  const f   = document.getElementById('status-filter').value;
  const url = f ? `/tickets?status=${f}` : '/tickets';
  try {
    const r = await fetch(url);
    _tickets = await r.json();
    renderList();
  } catch(e) { console.error(e); }
}

function renderList() {
  const el = document.getElementById('ticket-list');
  if (!_tickets.length) {
    el.innerHTML = '<div style="padding:20px;text-align:center;color:var(--muted);font-size:13px">No tickets found.</div>';
    return;
  }
  el.innerHTML = _tickets.map(t => `
    <div class="ticket-item${t.ticket_id===_selectedId?' active':''}" onclick="selectTicket('${t.ticket_id}')">
      <div class="ticket-item-title">${esc(t.title)}</div>
      <div class="ticket-item-meta">
        ${statusBadge(t.status)}
        ${priorityBadge(t.priority)}
        ${catBadge(t.category)}
        <span class="ticket-item-time">${timeAgo(t.created_at)}</span>
      </div>
    </div>
  `).join('');
}

/* --------------------------------------------------------- ticket detail */

async function selectTicket(id) {
  _selectedId = id;
  renderList();
  try {
    const r = await fetch(`/tickets/${id}`);
    const t = await r.json();
    if (!r.ok) { showDetail(`<div class="empty-state"><p style="color:var(--danger)">${esc(t.error)}</p></div>`); return; }
    renderDetail(t);
  } catch(e) { console.error(e); }
}

function renderDetail(t) {
  const msgs = (t.messages || []).map(m => `
    <div class="message-bubble">
      <div class="msg-header">
        <span class="msg-author">${esc(m.author)}</span>
        <span class="msg-time">${fmt(m.created_at)}</span>
      </div>
      <div class="msg-text">${esc(m.message_text)}</div>
    </div>
  `).join('') || '<p style="color:var(--muted);font-size:13px">No messages yet.</p>';

  showDetail(`
    <div class="ticket-detail">
      <div class="detail-title">${esc(t.title)}</div>
      <div class="detail-meta">${statusBadge(t.status)}${priorityBadge(t.priority)}${catBadge(t.category)}</div>
      <div class="detail-info">Created by ${esc(t.created_by)} &nbsp;&middot;&nbsp; ${fmt(t.created_at)}</div>

      <div class="actions-bar">
        <label>Status:</label>
        <select id="status-sel" onchange="updateStatus('${t.ticket_id}',this.value)">
          <option value="open"        ${t.status==='open'       ?'selected':''}>Open</option>
          <option value="in_progress" ${t.status==='in_progress'?'selected':''}>In Progress</option>
          <option value="resolved"    ${t.status==='resolved'   ?'selected':''}>Resolved</option>
        </select>
        <span id="status-msg" class="status-msg"></span>
        <div style="margin-left:auto">
          <button class="btn btn-danger btn-sm" onclick="openConfirm('${t.ticket_id}')">Delete</button>
        </div>
      </div>

      <div class="section-title">Messages (${t.messages.length})</div>
      ${msgs}

      <div class="form-card">
        <div class="form-group">
          <label>Add a message</label>
          <textarea id="msg-text" placeholder="Type your reply..." maxlength="2000"></textarea>
        </div>
        <div id="msg-feedback" class="form-feedback error"></div>
        <button class="btn btn-primary btn-sm" onclick="addMessage('${t.ticket_id}')">Send</button>
      </div>
    </div>
  `);
}

function showDetail(html) {
  document.getElementById('panel-right').innerHTML = html;
}

/* ----------------------------------------------------------- update status */

async function updateStatus(id, status) {
  const msgEl = document.getElementById('status-msg');
  msgEl.textContent = 'Saving...';
  msgEl.style.color = 'var(--muted)';
  try {
    const r = await fetch(`/tickets/${id}/status`, {
      method: 'PATCH',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({status}),
    });
    const d = await r.json();
    if (!r.ok) { msgEl.style.color='var(--danger)'; msgEl.textContent=d.error; return; }
    msgEl.style.color = 'var(--success)';
    msgEl.textContent = 'Saved!';
    setTimeout(() => msgEl.textContent = '', 2000);
    loadTickets(); loadStats();
  } catch(e) { msgEl.textContent='Failed.'; }
}

/* ----------------------------------------------------------- add message */

async function addMessage(ticketId) {
  const text  = (document.getElementById('msg-text')?.value || '').trim();
  const fbEl  = document.getElementById('msg-feedback');
  fbEl.textContent = '';
  if (!text)          { fbEl.textContent='Message text is required.'; return; }
  if (text.length>2000){ fbEl.textContent='Max 2 000 characters.'; return; }
  try {
    const r = await fetch(`/tickets/${ticketId}/messages`, {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({message_text:text}),
    });
    const d = await r.json();
    if (!r.ok) { fbEl.textContent=d.error; return; }
    selectTicket(ticketId);
  } catch(e) { fbEl.textContent='Failed to send.'; }
}

/* --------------------------------------------------------- new ticket modal */

function openNewModal() {
  document.getElementById('nt-title').value    = '';
  document.getElementById('nt-priority').value = 'medium';
  document.getElementById('nt-category').value = 'question';
  document.getElementById('nt-feedback').textContent = '';
  document.getElementById('new-modal').classList.add('open');
  setTimeout(() => document.getElementById('nt-title').focus(), 50);
}
function closeNewModal() { document.getElementById('new-modal').classList.remove('open'); }

async function submitNewTicket() {
  const title    = document.getElementById('nt-title').value.trim();
  const priority = document.getElementById('nt-priority').value;
  const category = document.getElementById('nt-category').value;
  const fbEl     = document.getElementById('nt-feedback');
  fbEl.textContent = '';
  if (!title) { fbEl.textContent='Title is required.'; return; }
  try {
    const r = await fetch('/tickets', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({title, priority, category}),
    });
    const d = await r.json();
    if (!r.ok) { fbEl.textContent=d.error; return; }
    closeNewModal();
    await loadTickets(); await loadStats();
    selectTicket(d.ticket_id);
  } catch(e) { fbEl.textContent='Failed to create ticket.'; }
}

/* ------------------------------------------------------- delete + confirm */

function openConfirm(id) {
  _pendingDelete = id;
  document.getElementById('confirm-modal').classList.add('open');
}
function closeConfirm() {
  _pendingDelete = null;
  document.getElementById('confirm-modal').classList.remove('open');
}

async function confirmDelete() {
  const id = _pendingDelete;
  closeConfirm();
  try {
    const r = await fetch(`/tickets/${id}`, {method:'DELETE'});
    if (!r.ok) { const d=await r.json(); alert(d.error||'Delete failed.'); return; }
    _selectedId = null;
    showDetail('<div class="empty-state"><p>Ticket deleted.</p></div>');
    await loadTickets(); await loadStats();
  } catch(e) { alert('Delete failed.'); }
}

/* ---------------------------------------------------------- keyboard shortcuts */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeNewModal(); closeConfirm(); }
});

/* ---------------------------------------------------------- init */
loadStats();
loadTickets();
</script>
</body>
</html>
